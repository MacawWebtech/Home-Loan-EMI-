    <script>
      /* Pre-paint: apply saved theme + direction before first render (prevents flash) */ (function () {
        try {
          var d = document.documentElement,
            t = localStorage.getItem("ll-theme"),
            r = localStorage.getItem("ll-dir");
          d.setAttribute(
            "data-theme",
            t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
          );
          if (r === "rtl") {
            d.setAttribute("dir", "rtl");
            var l = document.getElementById("bs-css");
            l.href = l.href.replace("bootstrap.min.css", "bootstrap.rtl.min.css");
          }
        } catch (e) {}
        document.addEventListener(
          "error",
          function (e) {
            var i = e.target;
            if (i && i.tagName === "IMG" && i.dataset.fallback && !i.dataset.fell) {
              i.dataset.fell = "1";
              i.removeAttribute("srcset");
              i.src = i.dataset.fallback;
            }
          },
          true,
        );
      })();
    </script>
